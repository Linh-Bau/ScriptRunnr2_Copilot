  test_targets: 
    - model_id: "VN6500ABKW0B"
      environment: *t650_environment 
      test_config: *t650_configuration 
      test_sequence: *t650_test_sequence 

    - model_id: "VN6500ABER01"
      environment: *t650_environment 
      test_config: *VN6500ABER01_configuration 
