                    with:
                      error_code: VFI_VRK_ECC_CHECK

        - name: VFI_AUTHN_RSA_CHECK
          steps:
            - do: cam.check_ocr_string
              with:
                regex: "VFI_AUTHN_RSA:\\s*\\w+"
                expect_string: Installed
                convert: none
