                save_image_with_name: ~
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: VFI_AUTHN_RSA_CHECK

        - name: VFI_PAIRING_RSA_CHECK
          steps:
            - do: cam.check_ocr_string
              with:
                regex: "VFI_AUTHN_RSA:\\s*\\w+"
                expect_string: Installed
                convert: none
                timeout: 60
                save_image_with_name: ~
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: VFI_PAIRING_RSA_CHECK
       
        # ảnh số 4 -> show_mib
        # 1.part_number
        # 2.hardware_version
        # 3.model
        # 4.sn
        - name: MIB_PART_NUMBER
          steps: 
            - do: cam.set_operation_image # hiển thị ảnh hướng dẫn
              with:
                image: $path ./setup/image/4.png
              on_success:
                - do: return.continue
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: SET_OPERATOR_IMAGE_FAIL
            - do: cam.check_ocr_string
              with:
                regex: $context MES[CustomModel]
                expect_string: $context MES[CustomModel]
                convert: none
                timeout: 60
                save_image_with_name: MIB_PART_NUMBER.png
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: MIB_PART_NUMBER


        - name: MIB_HARDWARE_VERSION_CHECK
          steps: 
            - do: cam.check_ocr_string
              with:
                regex: $context MES[HW Rev.]
                expect_string: $context MES[HW Rev.]
                convert: none
                timeout: 60
                save_image_with_name: MIB_HARDWARE_VERSION_CHECK.png
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: MIB_HARDWARE_VERSION_CHECK

        - name: MIB_MODEL_CHECK
          steps: 
            - do: cam.check_ocr_string
              with:
                regex: $script_config txt_model
                expect_string: $script_config txt_model
                convert: none
                timeout: 60
                save_image_with_name: MIB_MODEL_CHECK.png
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: MIB_MODEL_CHECK

        - name: MIB_SN_CHECK
          steps: 
            - do: cam.check_ocr_string
              with:
                regex: \d{3}-\d{3}-\d{3}
                expect_string: $context MES[csn]
                convert: none
                timeout: 60
                save_image_with_name: ANDROID_VERSION_CHECK.png
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: ANDROID_VERSION_CHECK

        # ảnh số 5 
