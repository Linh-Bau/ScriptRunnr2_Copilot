# FILE cấu hình chung cho script

script:
  test_environments: # thiết lập cài đặt tải xuống
    - &t650_environment
      downloads: 
        - name: "tesseract-ocr" 
          type: "folder" # loại tải về: folder, file, compressed
          from: "/SFTP.conf.pe.02/V6ENV/tessdata" 
          to: "./setup/tessdata" 
          extract_to: ~
        - name: "image" 
          type: "folder"
          from: "./setup/image" 
          to: "./setup/image"


  test_configurations: # thiết lập config  cho script
    - &t650_configuration
      flags:
        - enable_camera_window
        - skip_upload_defect_code
      script_information: 
        station_name: "CAMERA STATION" 
        description: "T650P CHECK INFOMATION"

      script_configuration:
        general:
          txt_model: 650m 
          txt_android_build: 3357
          txt_secured_os_core: 015
          txt_android_version: 810
          txt_part_number: 410-32-EUC-6

        fixture_configuration: 
          - nothing: ~

    - &VN6500ABER01_configuration
      flags:
        - enable_camera_window
        - skip_upload_defect_code
      script_information: 
        station_name: "CAMERA STATION" 
        description: "T650P CHECK INFOMATION"

      script_configuration:
        general:
          txt_model: 650m 
          txt_android_build: 3357
          txt_secured_os_core: 015
          txt_android_version: 810
          txt_part_number: 410-32-EUC-6

        fixture_configuration: 
          - nothing: ~    
    
  test_sequences: 
    - &t650_test_sequence
      test_items:
        - name: CHECK_MBS_NO
          steps: 
            - do: if.condition
              with:
                condition: $if {$user_config mes_on} == False
              on_success:
                - do: logger.info
                  with:
                    message: Chế độ debug, bỏ qua check mbsno
                - do: return.pass

            - do: mes.check_mbs_no 
              with: ~
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: CHECK_MBSNO_FAIL

        - name: GET_MES_INFOMATION
          steps: 
            - do: mes.get_csn 
              with: ~
              on_success:
                - do: return.continue
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: GET_CSN_FAIL
            - do: mes.get_control_table
              with: ~
              on_success:
                - do: return.continue
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: GET_CONTROL_TABLE_FAIL
            - do: mes.get_mac_list_ex_from_sno_code
              with: ~
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: GET_MAC_LIST_FAIL
                      
        # ảnh số 1
        # 1.model -> 650p
        # 2.sn
        # 3.android_build
        # 4.pin
        # 5.secured os  
           
        - name: CHECK_MODEL
          steps: 
            - do: cam.set_operation_image # hiển thị ảnh hướng dẫn
              with:
                image: $path ./setup/image/1.png
              on_success:
                - do: return.continue
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: SET_OPERATOR_IMAGE_FAIL

            - do: cam.check_ocr_string
              with:
                regex: $script_config txt_model
                expect_string: $script_config txt_model # chữ t sẽ bị nhận nhầm thành số 1
                convert: none
                timeout: 60
                save_image_with_name: CHECK_MODEL.png
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: CHECK_MODEL
           
        - name: SN_CHECK
          steps: 
            - do: cam.check_ocr_string
              with:
                regex: \d{3}-\d{3}-\d{3}
                expect_string: $context MES[csn]
                convert: none
                timeout: 60
                save_image_with_name: CSN_CHECK.png
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: CSN_CHECK

        - name: ANDROID_BUILD_CHECK
          steps: 
            - do: cam.check_ocr_string
              with:
                regex: Android build T650-\S+
                expect_string: $script_config txt_android_build
                convert: remove_special_characters
                timeout: 60
                save_image_with_name: ANDROID_BUILD_CHECK.png
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: ANDROID_BUILD_CHECK

        - name: BATTERY_CHECK
          steps: 
            - do: cam.get_ocr_string
              with:
                regex: (?<=Battery level )\d+%
                var_name: PROD[battery_level]
                convert: remove_special_characters
                timeout: 60
                save_image_with_name: BATTERY_CHECK.png
              on_success:
                - do: logger.info
                  with:
                    message: "$ product batttery: {$context PROD[battery_level]}%"
                - do: if.condition
                  with:
                    condition: $if {$context PROD[battery_level]} > 75 #  cần sửa về 75
                  on_success:
                    - do: return.pass
                  on_fail:
                    - do: logger.info
                      with:
                        message: battery_level check fail!
                    - do: return.fail
                      with:
                        error_code: BATTERY_LEVEL_CHECK
              on_fail:
                  - do: return.fail
                    with:
                      error_code: BATTERY_CHECK

        # - name: SECURE_OS_DRIVER_CHECK
        #   steps: 
        #     - do: cam.check_ocr_string
        #       with:
        #         regex: "Secure OS Driver: \\S+"
        #         expect_string: A053
        #         convert: none
        #         timeout: 60
        #         save_image_with_name: SECURE_OS_DRIVER_CHECK.png
        #       on_success:
        #         - do: return.pass
        #           with: ~
        #       on_fail:
        #           - do: return.fail
        #             with:
        #               error_code: SECURE_OS_DRIVER_CHECK

        - name: SECURE_OS_CORE_CHECK
          steps: 
            - do: cam.check_ocr_string
              with:
                regex: "Core: T650\\S+"
                expect_string: $script_config txt_secured_os_core
                convert: remove_special_characters
                timeout: 60
                save_image_with_name: SECURE_OS_CORE_CHECK.png
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: SECURE_OS_CORE_CHECK

        # - name: SECURE_OS_DLL_CHECK
        #   steps: 
        #     - do: cam.check_ocr_string
        #       with:
        #         regex: "DLL: T650\\S+"
        #         expect_string: A13
        #         convert: remove_special_characters
        #         timeout: 60
        #         save_image_with_name: SECURE_OS_DLL_CHECK.png
        #       on_success:
        #         - do: return.pass
        #           with: ~
        #       on_fail:
        #           - do: return.fail
        #             with:
        #               error_code: SECURE_OS_DLL_CHECK

        # ảnh số 2
        # 1.android_version
        # 2.date_time
        # 3.part_number
        - name: ANDROID_VERSION_CHECK
          steps: 
            - do: cam.set_operation_image # hiển thị ảnh hướng dẫn
              with:
                image: $path ./setup/image/2.png
              on_success:
                - do: return.continue
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: SET_OPERATOR_IMAGE_FAIL
            - do: cam.check_ocr_string
              with:
                regex: Android version \S+
                expect_string: $script_config txt_android_version
                convert: remove_special_characters
                timeout: 60
                save_image_with_name: ANDROID_VERSION_CHECK.png
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: ANDROID_VERSION_CHECK

        - name: PART_NUMBER_CHECK
          steps: 
            - do: cam.check_ocr_string
              with: 
                regex: Part number \S+
                expect_string: $script_config txt_part_number
                convert: none
                timeout: 60
                save_image_with_name: PART_NUMBER_CHECK.png
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: PART_NUMBER_CHECK
        
        - name: DATE_TIME_CHECK
          steps: 
            - do: cam.get_ocr_string
              with:
                regex: (January|February|March|April|May|June|July|August|September|October|November|December) ([1-9]|[12][0-9]|3[01]),\s(0?[1-9]|1[0-2]):[0-5][0-9]\s(AM|PM) # chat gpt
                var_name: PROD[date_time]
                convert: none
                timeout: 60
                save_image_with_name: DATE_TIME_CHECK.png
              on_success:
                - do: return.continue # skip
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: DATE_TIME_CHECK

            - do: func.date_time_check
              with:
                prod_date_time: $context PROD[date_time]
                prod_date_time_format: MMMM dd, h:mm tt
                source: pc
                tolerance: 120
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: DATE_TIME_CHECK

        # ảnh số 3. 
        # 1.VFI_VRK_RSA
        # 2.VFI_VRK_ECC
        # 3.VFI_AUTHN_RSA
        # 4.VFI_PAIRING_RSA
        - name: VFI_VRK_RSA_CHECK
          steps: 
            - do: cam.set_operation_image # hiển thị ảnh hướng dẫn
              with:
                image: $path ./setup/image/3.png
              on_success:
                - do: return.continue
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: SET_OPERATOR_IMAGE_FAIL
            - do: cam.check_ocr_string
              with:
                regex: "VFI_VRK_RSA:\\s*\\w+"
                expect_string: Installed
                convert: none
                timeout: 60
                save_image_with_name: ~
              on_success:
                - do: return.pass
                  with: ~
              on_fail:
                  - do: return.fail
                    with:
                      error_code: VFI_VRK_RSA_CHECK

        - name: VFI_VRK_ECC_CHECK
          steps:
            - do: cam.check_ocr_string
              with:
                regex: "VFI_VRK_ECC:\\s*\\w+"
                expect_string: Installed
                convert: none
